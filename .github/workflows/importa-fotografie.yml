name: Importa foto dell'aula esterna
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/importa-fotografie.yml'
permissions:
  contents: write
jobs:
  importa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recupera foto originale dal documento
        env:
          PHOTO_URL: "https://docs.google.com/docs-images-rt/AIpPl2CbQmprorhDYAsBH82ifWSQhlnNLbcTEksLSY0AeMYYu_4ROhHOJ7CQFPS88mXpGh52gN1oCMp6YKe32VZtnLokDqgAOy54ZgIwWgDQG1bPmtqzb68aZcXCb2VnGeq-1FOmU17FqVMrzJjnFXJt1Rvs0Azl0-L37LS8VJsf6MNa4HMYBGU=s2048?key=_NP-qTnIMHAC4miFOKI7xg"
        run: |
          python3 - <<'PY'
          import os, urllib.request
          from pathlib import Path
          u=os.environ["PHOTO_URL"]
          req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=45) as r:
              raw=r.read()
              mime=r.headers.get("Content-Type","")
          if not mime.startswith("image/") or len(raw)<1500:
              raise RuntimeError("Immagine non valida: "+mime)
          out=Path("images/creature-magiche-esterno.png")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(raw)
          print("Fotografia esterna recuperata:",len(raw),"byte")
          PY
      - name: Pubblica fotografia esterna
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/creature-magiche-esterno.png
          if ! git diff --cached --quiet; then
            git commit -m "Aggiunge fotografia originale aula esterna Creature Magiche"
            git push
          fi
